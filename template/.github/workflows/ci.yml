# qbm-@QB_NAME@ — build and test.
#
# This workflow ships with the module on purpose. The template it came from sat untouched from
# 2019 to 2026 and stopped configuring at all, and the single reason nobody noticed was that
# nothing built it. A generated module starts with a lane so the same thing cannot happen here.
#
# Read the anti-vacuity steps before trimming this file. Each exists because the corresponding
# failure has actually shipped in this ecosystem:
#   * a build that compiled 0 translation units and reported success;
#   * a test lane that ran 0 tests and exited 0, because `ctest` says "No tests were found!!!"
#     with a zero exit code;
#   * a suite that "100% passed" while every test in it self-skipped — ctest counts a skip as a
#     pass, so a headline percentage is not evidence that anything executed.
name: ci

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      # A qbm module cannot be configured on its own — see .github/ci/superbuild/CMakeLists.txt.
      # That root fetches qb at the ref recorded when this module was scaffolded.
      - name: Configure
        run: cmake -S .github/ci/superbuild -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # A registration floor, checked BEFORE the build: a suite that vanished from registration
      # fails here, while the reason is still legible, rather than being silently absent from the
      # totals later. A floor may only ever go UP.
      - name: Registration floor
        run: |
          set -euo pipefail
          count="$(ctest --test-dir build -N -L 'module:qbm-@QB_NAME@' | grep -cE '^ *Test +#[0-9]+:' || true)"
          echo "qbm-@QB_NAME@ registered: ${count} (floor 2)"
          [ "${count}" -ge 2 ] || { echo "::error::registered ${count} tests, below the floor of 2"; exit 1; }
          echo "TEST_FLOOR=2" >> "${GITHUB_ENV}"

      # Name the target. QB_BUILD_TESTS is global, so an unqualified build would also compile
      # qb's own ~174 test binaries, which this lane does not run and qb's CI already builds.
      - name: Build this module's tests
        run: |
          set -euo pipefail
          cmake --build build --parallel --target qbm-@QB_NAME@-tests 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Translation units compiled must be non-zero
        run: |
          set -euo pipefail
          tus="$(grep -c 'Building CXX object' "${RUNNER_TEMP}/build.log" || true)"
          echo "translation units compiled: ${tus}"
          [ "${tus}" -gt 0 ] || { echo "::error::0 TUs compiled; every count below would be vacuous"; exit 1; }

      # Every registered test must have an executable on disk. A target renamed out from under a
      # ctest entry shows up here, named, instead of as a puzzling "Not Run" later.
      - name: Every registered test has an executable
        run: |
          set -euo pipefail
          ctest --test-dir build -L 'module:qbm-@QB_NAME@' --show-only=json-v1 > "${RUNNER_TEMP}/tests.json"
          python3 - "${RUNNER_TEMP}/tests.json" <<'PY'
          import json, os, sys
          tests = json.load(open(sys.argv[1]))["tests"]
          missing = [t["name"] for t in tests
                     if not t.get("command") or not os.path.exists(t["command"][0])]
          print(f"registered={len(tests)} without an executable={len(missing)}")
          for n in missing: print(f"  NO EXECUTABLE: {n}")
          sys.exit(1 if missing else 0)
          PY

      - name: Test — executed, not skipped
        run: |
          set -euo pipefail
          ctest --test-dir build -L 'module:qbm-@QB_NAME@' --output-on-failure \
                --output-junit "${RUNNER_TEMP}/results.xml"
          python3 - "${RUNNER_TEMP}/results.xml" "${TEST_FLOOR}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          floor = int(sys.argv[2])
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          failed  = [c.get('name') for c in cases if c.find('failure') is not None]
          executed = len(cases) - len(skipped)
          print(f"registered={len(cases)} executed={executed} skipped={len(skipped)} failed={len(failed)} floor={floor}")
          for n in skipped: print(f"  SKIPPED: {n}")
          bad = False
          if len(cases) < floor: print(f"::error::{len(cases)} registered, floor is {floor}"); bad = True
          if executed < floor:   print(f"::error::{executed} EXECUTED, floor is {floor}"); bad = True
          if skipped:            print("::error::a test self-skipped; ctest reports that as a pass"); bad = True
          if failed:             print(f"::error::{len(failed)} test(s) failed"); bad = True
          sys.exit(1 if bad else 0)
          PY
